name: Auto Post to Threads

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '30 6 * * *'
    - cron: '0 10 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run post script
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post.py

      - name: Save updated posts.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          touch log.txt
          git add posts.json log.txt
          git diff --staged --quiet || git commit -m "Update post status"
          git push
